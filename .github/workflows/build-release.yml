name: Build and Upload Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      BIN_NAME: SHIEP-Pipeline
      VERSION: ${{ github.ref_name }}
      SHIEP_PIPELINE_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            target_label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_label: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (official rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}

      - name: Toolchain versions
        run: |
          rustc +stable -V
          cargo +stable -V

      - name: Build binary
        run: cargo +stable build --locked --release -p ec-cli --target ${{ matrix.target }}

      - name: Upload release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/${BIN_NAME}-${VERSION}-${{ matrix.target_label }}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$OUT"
          gh release upload "$VERSION" "$OUT" --clobber

      - name: Upload release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Out = "dist/$env:BIN_NAME-$env:VERSION-${{ matrix.target_label }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $Out
          gh release upload "$env:VERSION" $Out --clobber
