name: Build Test Binaries
run-name: Test binaries (${{ github.ref_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target_label }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            target_label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_label: windows-x64

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (official rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}

      - name: Toolchain versions
        run: |
          rustc +stable -V
          cargo +stable -V

      - name: Test workspace
        run: cargo +stable test --locked --workspace --target ${{ matrix.target }}

      - name: Build and check debug binary
        env:
          SHIEP_PIPELINE_VERSION: test-${{ steps.checkout.outputs.commit }}
        run: cargo +stable run --locked -p ec-cli --target ${{ matrix.target }} -- --version

      - name: Build and check release binary
        env:
          SHIEP_PIPELINE_VERSION: test-${{ steps.checkout.outputs.commit }}
        run: cargo +stable run --locked --release -p ec-cli --target ${{ matrix.target }} -- --version

      - name: Package test binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          tar -czf SHIEP-Pipeline-${{ matrix.target_label }}.tar.gz
          -C target/${{ matrix.target }}
          debug/SHIEP-Pipeline release/SHIEP-Pipeline

      - name: Upload test binaries (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: SHIEP-Pipeline-${{ matrix.target_label }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload test binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SHIEP-Pipeline-${{ matrix.target_label }}
          path: |
            target/${{ matrix.target }}/debug/SHIEP-Pipeline.exe
            target/${{ matrix.target }}/release/SHIEP-Pipeline.exe
          if-no-files-found: error
          retention-days: 14
